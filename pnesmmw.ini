# PocketNES Menu Maker ini
# lines starting with # are comments ignored by program
# relative paths are relative to the program directory

# 1 to use numbering of the menu
number=0

# 1 to mark multibootable roms <192k in the menu
showsmall=0

# 1 to use names in database for menu
lookupname=1

# 1 to clean out the ( and [ stuff from GoodNES roms
cleanlist=1

# 1 to use variables from list
usevars=1

# 1 to pad file to power of 2 size for multibooting
padsize=0

# 1 to use splash screen
usesplash=0

# 1 to use megabyte for sizes
usembyte=0

# 1 to use expert mode
expert=0

# 1 to show sizes in filelist
showsize=0

# 1 to cut overdumped roms down to their real size
trimoverdump=1

# 1 to clean garbage (DiskDude! etc) from iNES headers
fixheader=1

# 1 to enable PAL timing for European roms without vars
autopal=0

# path to roms (empty = program directory)
rompath=
# filenames to use
pocketnes=pocketnes.gba
romfile=PocketNESMenu.gba
varsfile=pnesmmw.mdb
splashfile=splash.raw

# Mappers to support (only used for the compatibility check)
# mappers for PocketNES v9 (flubba)
#mappers=0|1|2|3|4|7|9|11|15|16|17|18|19|21|22|23|24|25|26|32|33|34|65|66|67|68|69|70|71|72|73|75|76|78|79|80|86|87|92|93|94|97|99|105|151|152|180|228|232|
# mappers for current PocketNES (Dwedit)
mappers=0|1|2|3|4|5|7|9|10|11|15|16|17|18|19|21|22|23|24|25|26|30|32|33|34|40|42|64|65|66|67|68|69|70|71|72|73|74|75|76|77|78|79|80|85|86|87|88|92|93|94|97|99|105|118|119|140|151|152|158|163|178|180|184|187|206|218|228|232|245|249|252|254|
