name: Build

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this new tag (e.g. v2.0.3). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  windows:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          # 64-bit: current Python, Windows 8.1 or newer
          - name: pnesmmw-windows
            python: "3.12"
            arch: x64
            machine: "0x8664"
            pyinstaller: pyinstaller
          # 32-bit: Python 3.8 is the last release that runs on Windows 7,
          # and PyInstaller 5.x still supports it
          - name: pnesmmw-windows-32bit
            python: "3.8"
            arch: x86
            machine: "0x14c"
            pyinstaller: pyinstaller==5.13.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - run: pip install "${{ matrix.pyinstaller }}"
      - run: python -m unittest discover -s tests
      - name: Build exe
        run: |
          pyinstaller --onefile --windowed --name pnesmmw pnesmmw.py
          pyinstaller --onefile --console --name pnesmmw-cli pnesmmw.py
      - name: Check exe architecture
        shell: python
        run: |
          import struct
          for exe in ("dist/pnesmmw.exe", "dist/pnesmmw-cli.exe"):
              data = open(exe, "rb").read(4096)
              pe, = struct.unpack_from("<I", data, 0x3c)
              machine, = struct.unpack_from("<H", data, pe + 4)
              print(exe, hex(machine))
              assert machine == ${{ matrix.machine }}, "wrong architecture"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory ${{ matrix.name }}
          Copy-Item dist/pnesmmw.exe, dist/pnesmmw-cli.exe, pnesmmw.mdb, README.md ${{ matrix.name }}/
          dist/pnesmmw-cli.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}/

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          mkdir pnesmmw-linux
          cp pnesmmw.py pnesmmw.mdb README.md pnesmmw-linux/
          chmod +x pnesmmw-linux/pnesmmw.py
      - uses: actions/upload-artifact@v4
        with:
          name: pnesmmw-linux
          path: pnesmmw-linux/

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Zip
        run: |
          (cd pnesmmw-windows && zip -r ../pnesmmw-windows.zip .)
          (cd pnesmmw-windows-32bit && zip -r ../pnesmmw-windows-32bit.zip .)
          chmod +x pnesmmw-linux/pnesmmw.py
          tar czf pnesmmw-linux.tar.gz pnesmmw-linux
      - uses: softprops/action-gh-release@v2
        with:
          # a manual run creates the tag on the commit it built
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            pnesmmw-windows.zip
            pnesmmw-windows-32bit.zip
            pnesmmw-linux.tar.gz
